<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <div style="height:68px;background:#fff;border-bottom:1px solid #E2E8F0;box-sizing:border-box">
    <div style="max-width:1200px;height:100%;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:32px">
      <div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg></div><span style="font-weight:700;font-size:16px;color:#0F172A">telemedconsult<span style="color:#2563EB">.md</span></span></div>
      <nav style="display:flex;gap:4px;flex:1">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
          <span style="height:36px;padding:0 14px;border-radius:8px;display:flex;align-items:center;font-size:14px;font-weight:{{ l.weight }};background:{{ l.bg }};color:{{ l.color }}">{{ l.label }}</span>
        </sc-for>
      </nav>
      <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
        <span style="height:40px;padding:0 16px;border-radius:10px;background:#2563EB;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center">Panoul meu</span>
      </sc-if>
      <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:8px;align-items:center">
          <span style="height:40px;padding:0 14px;border-radius:10px;color:#0F172A;font-size:14px;font-weight:500;display:flex;align-items:center">Intră în cont</span>
          <span style="height:40px;padding:0 16px;border-radius:10px;background:#2563EB;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center">Creează cont</span>
        </div>
      </sc-if>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div style="padding:50px 8px 10px 16px;background:#fff;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;gap:8px">
    <div style="display:flex;align-items:center;gap:8px;flex:1"><div style="width:28px;height:28px;border-radius:8px;background:#2563EB;display:flex;align-items:center;justify-content:center;color:#fff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg></div><span style="font-weight:700;font-size:14px;color:#0F172A">telemedconsult<span style="color:#2563EB">.md</span></span></div>
    <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><span style="height:36px;padding:0 12px;border-radius:10px;background:#2563EB;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center">Panoul meu</span></sc-if>
    <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><span style="height:36px;padding:0 12px;border-radius:10px;border:1px solid #E2E8F0;color:#0F172A;font-size:13px;font-weight:600;display:flex;align-items:center">Intră</span></sc-if>
    <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#334155"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:68},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;acasa&quot;,&quot;medici&quot;,&quot;noutati&quot;,&quot;parteneri&quot;],&quot;default&quot;:&quot;acasa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loggedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const L = [['acasa', 'Acasă'], ['medici', 'Medici'], ['noutati', 'Noutăți'], ['parteneri', 'Parteneri']];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'acasa', m = this.props.mode ?? 'desktop', li = !!this.props.loggedIn;
    return {
      isDesktop: m === 'desktop', isMobile: m === 'mobile', loggedIn: li, loggedOut: !li,
      links: L.map(([k, label]) => ({ label, bg: k === a ? '#EFF6FF' : 'transparent', color: k === a ? '#1D4ED8' : '#334155', weight: k === a ? 600 : 500 }))
    };
  }
}
</script>
</body>
</html>
