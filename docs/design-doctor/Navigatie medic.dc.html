<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<div style="width:232px;height:100%;box-sizing:border-box;background:#fff;border-right:1px solid #E2E8F0;display:flex;flex-direction:column;font-family:Geist,system-ui,sans-serif;color:#0F172A">
  <div style="height:64px;flex:none;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #F1F5F9"><div style="width:32px;height:32px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg></div><span style="font-weight:700;font-size:15px">telemedconsult<span style="color:#2563EB">.md</span></span></div>
  <div style="padding:16px 12px 8px;display:flex;flex-direction:column;gap:2px">
    <div style="height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;background:{{ home.bg }};color:{{ home.color }};font-weight:{{ home.w }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ home.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="flex:1">Acasă</span></div>
    <div style="height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;background:{{ cons.bg }};color:{{ cons.color }};font-weight:{{ cons.w }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ cons.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg><span style="flex:1">Consultații</span><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span></div>
    <div style="height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;background:{{ msg.bg }};color:{{ msg.color }};font-weight:{{ msg.w }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ msg.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span style="flex:1">Mesaje</span><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#2563EB;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">4</span></div>
    <div style="height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;background:{{ stat.bg }};color:{{ stat.color }};font-weight:{{ stat.w }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ stat.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg><span style="flex:1">Statistici</span></div>
    <div style="height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;background:{{ prof.bg }};color:{{ prof.color }};font-weight:{{ prof.w }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ prof.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span style="flex:1">Profil</span></div>
  </div>
  <div style="padding:14px 24px 6px;font-size:11px;font-weight:600;color:#94A3B8;letter-spacing:.06em">MAI MULT</div>
  <div style="padding:0 12px;display:flex;flex-direction:column;gap:2px">
    <div style="height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;background:{{ news.bg }};color:{{ news.color }};font-weight:{{ news.w }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ news.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5"></path><path d="M18 14h-8"></path><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"></path><rect width="8" height="4" x="10" y="6" rx="1"></rect></svg><span style="flex:1">Noutăți</span><span style="width:8px;height:8px;border-radius:50%;background:#2563EB"></span></div>
    <div style="height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;background:{{ tg.bg }};color:{{ tg.color }};font-weight:{{ tg.w }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ tg.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg><span style="flex:1;white-space:nowrap">Notificări Telegram</span></div>
  </div>
  <div style="flex:1"></div>
  <div style="padding:12px 16px;border-top:1px solid #F1F5F9;display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:#EFF6FF;color:#2563EB;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">AC</div><div style="display:flex;flex-direction:column;flex:1;min-width:0"><span style="font-size:13px;font-weight:600">Dr. Ana Ciobanu</span><span style="font-size:12px;color:#64748B">Medic de familie</span></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div>
</div>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<div style="height:72px;box-sizing:border-box;background:#fff;border-top:1px solid #E2E8F0;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:12px;font-family:Geist,system-ui,sans-serif">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:{{ home.mcolor }};font-weight:{{ home.w }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Acasă</div>
  <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:{{ cons.mcolor }};font-weight:{{ cons.w }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>Consultații<span style="position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#F59E0B;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span></div>
  <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:{{ msg.mcolor }};font-weight:{{ msg.w }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Mesaje<span style="position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#2563EB;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:{{ prof.mcolor }};font-weight:{{ prof.w }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Profil</div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:{{ more.mcolor }};font-weight:{{ more.w }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>Mai mult</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;cons&quot;,&quot;msg&quot;,&quot;stat&quot;,&quot;prof&quot;,&quot;news&quot;,&quot;tg&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const mode = this.props.mode ?? 'desktop';
    const it = k => { const on = a === k || (k === 'more' && ['stat', 'news', 'tg'].includes(a));
      return { bg: on ? '#EFF6FF' : 'transparent', color: on ? '#2563EB' : '#334155', icon: on ? '#2563EB' : '#64748B', w: on ? 600 : 500, mcolor: on ? '#2563EB' : '#64748B' }; };
    const o = { isDesktop: mode === 'desktop', isMobile: mode === 'mobile' };
    ['home', 'cons', 'msg', 'stat', 'prof', 'news', 'tg', 'more'].forEach(k => o[k] = it(k));
    return o;
  }
}
</script>
</body>
</html>
