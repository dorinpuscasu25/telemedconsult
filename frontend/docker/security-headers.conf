# Header-e de securitate comune.
#
# ATENȚIE: în nginx, directivele `add_header` NU se moștenesc într-un `location`
# care are propriile directive `add_header`. De aceea acest fișier trebuie
# inclus explicit în FIECARE location care definește add_header, nu doar la
# nivel de `server`.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
