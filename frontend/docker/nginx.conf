map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 64m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /runtime-env.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    # Imaginile, auscultațiile și filmările din aparat. Se servesc în flux, cu
    # cereri parțiale (`Range`), ca medicul să poată derula într-o înregistrare
    # fără s-o aștepte întreagă — de aceea buffering-ul e oprit aici, spre
    # deosebire de restul API-ului.
    location /api/v1/exam-media/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://api;
        proxy_read_timeout 120s;
    }

    location /storage/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://api;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/security-headers.conf;
    }

    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://reverb:8080;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://reverb:8080;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Bundle-urile au hash în nume, deci pot fi cache-uite agresiv.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # CRITIC: index.html NU trebuie cache-uit niciodată.
    #
    # index.html referă bundle-uri cu hash în nume (/assets/index-<hash>.js).
    # La fiecare deploy hash-ul se schimbă și fișierul vechi dispare. Dacă un
    # browser sau un CDN servește un index.html din cache, acesta cere un modul
    # care întoarce 404, nimic nu se execută și utilizatorul vede un ECRAN ALB
    # până face hard refresh. `no-store` elimină complet acest scenariu.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/security-headers.conf;
}
